name: distributed_properties_workshop
channels:
  - conda-forge # to instqall ipyevents etc. !!! and do not add defaults since then conda-forge's priority is overwritten
dependencies:
  - python=3.12
  - pyyaml # need that for loading yaml storage file of psi4 calculation
  - pip
  - numpy=1.26.4
  - libstdcxx-ng
  - mayavi=4.8.2
  - PyQT=5.15.11
  - vtk=9.3.1
  - jupyter==1.0.0
  - ipyevents==2.0.2
  - rdkit # Could be dropped if necessary
  - ipywidgets    # Need for displaying in terminal
  - setuptools<81 # Required by mlab package
  - pip:
    - ipykernel
      # - numpy<2.0 # Mayavi does not work with numpy 2
    - pydantic
    - rich # could be dropped if necessary
    # FOR MAYAVI!!!
      #     - mayavi        # used 4.9.0 during testing
      #       # - puremagic<2.0 # Problem with interactive viewer for 2.0
      #     - ipywidgets    # Need for displaying in terminal
      #     - ipyevents     # Need for displying in terminal
      #     - PyQT5
    - git+ssh://git@github.com/bruno-von-bruening/qcp_MolView.git
    - git+ssh://git@github.com/bruno-von-bruening/qcp_global_utils.git@68f3857ae
    - git+ssh://git@github.com/bruno-von-bruening/qcp_objects.git@6e0294ed5
    - git+ssh://git@github.com/bruno-von-bruening/qcp_MolView.git@448a41eef
      #     # Not required
      #     - rdkit         # Needed to show bonds in molecules
      #     - rich          # For nice printout
